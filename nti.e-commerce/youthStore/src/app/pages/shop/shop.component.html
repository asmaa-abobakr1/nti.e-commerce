<div class="container py-5">
  <div class="row g-4">
    <!-- Filters Sidebar -->
    <div class="col-lg-3">
      <div class="card glass-morphism p-4 rounded-4 shadow-sm">
        <h5 class="fw-bold mb-4">Filters</h5>

        <!-- Search -->
        <div class="mb-4">
          <label class="form-label small fw-bold" for="productSearch"
            >Search</label
          >
          <input
            id="productSearch"
            type="text"
            class="form-control rounded-pill"
            [(ngModel)]="filters.name"
            (ngModelChange)="applyFilters()"
            placeholder="Product name..."
            title="Search products by name"
          />
        </div>

        <!-- Categories -->
        <div class="mb-4">
          <label class="form-label small fw-bold" for="categorySelect"
            >Category</label
          >
          <select
            id="categorySelect"
            class="form-select rounded-pill"
            [(ngModel)]="filters.category"
            (change)="applyFilters()"
            title="Filter products by category"
          >
            <option value="">All Categories</option>
            <option *ngFor="let cat of categories" [value]="cat._id">
              {{ cat.title }}
            </option>
          </select>
        </div>

        <!-- Gender -->
        <div class="mb-4">
          <label class="form-label small fw-bold">Gender</label>
          <div class="d-flex gap-2">
            <button
              class="btn btn-sm btn-outline-primary rounded-pill flex-grow-1"
              [class.active]="filters.gender === 'boys'"
              (click)="filters.gender = 'boys'; applyFilters()"
            >
              Boys
            </button>
            <button
              class="btn btn-sm btn-outline-primary rounded-pill flex-grow-1"
              [class.active]="filters.gender === 'girls'"
              (click)="filters.gender = 'girls'; applyFilters()"
            >
              Girls
            </button>
          </div>
        </div>

        <!-- Price Range -->
        <div class="mb-4">
          <label class="form-label small fw-bold"
            >Price Range (${{ filters.minPrice }} - ${{
              filters.maxPrice
            }})</label
          >
          <input
            type="range"
            class="form-range"
            min="0"
            max="2000"
            step="50"
            [(ngModel)]="filters.maxPrice"
            (change)="applyFilters()"
            title="Filter by maximum price"
          />
        </div>

        <button
          class="btn btn-primary w-100 rounded-pill"
          (click)="
            filters = {
              name: '',
              category: '',
              gender: '',
              minPrice: 0,
              maxPrice: 1000,
            };
            applyFilters()
          "
        >
          Reset Filters
        </button>
      </div>
    </div>

    <!-- Product Grid -->
    <div class="col-lg-9">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0">
          Collections
          <span class="text-gray fw-normal fs-6"
            >({{ products.length }} items)</span
          >
        </h4>
        <select
          class="form-select w-auto rounded-pill border-0 shadow-sm px-4 py-2"
          title="Sort products by criteria"
          aria-label="Sort products"
        >
          <option>Sort by: Newest</option>
          <option>Price: Low to High</option>
          <option>Price: High to Low</option>
        </select>
      </div>

      <div class="row g-4">
        <div class="col-md-6 col-lg-4" *ngFor="let prod of products">
          <app-product-card
            [product]="prod"
            layout="grid"
            (addToCart)="addToCart($event)"
          ></app-product-card>
        </div>
      </div>
    </div>
  </div>
</div>
