<!-- Hero Section -->
<section class="hero-section py-5 d-flex align-items-center">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-lg-6" data-aos="fade-right">
        <h1 class="display-3 fw-bolder mb-4 text-dark">
          {{ settings?.heroTitle || "DEFINE YOUR CASUAL STYLE" }}
        </h1>
        <p class="lead mb-5 text-gray">
          {{
            settings?.heroSubtitle ||
              "Exclusive casual collections for the youth generation."
          }}
        </p>
        <div class="d-flex gap-3">
          <a
            routerLink="/shop"
            class="btn btn-primary btn-lg px-5 rounded-pill shadow-lg"
            >Shop Now</a
          >
          <a
            routerLink="/shop"
            class="btn btn-outline-dark btn-lg px-5 rounded-pill"
            >Explore</a
          >
        </div>
      </div>
      <div class="col-lg-6 d-none d-lg-block" data-aos="zoom-in">
        <div class="hero-img-container position-relative">
          <div class="img-blob bg-primary opacity-10"></div>
          <img
            src="C:\Users\acer\.gemini\antigravity\brain\3af0a81a-d301-4fac-9c81-703da9e956c3\youth_fashion_hero_1778673468322.png"
            class="img-fluid rounded-5 shadow-2xl floating-img"
            alt="Youth Fashion"
          />
          <div
            class="floating-badge glass-morphism p-3 rounded-4 shadow-lg animate-bounce-slow"
          >
            <span class="d-block fw-bold fs-4">New Season</span>
            <span class="text-secondary">Up to 40% Off</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Marketing Slider (Random Pics) -->
<section class="py-4 bg-light overflow-hidden">
  <div class="container-fluid px-0">
    <div class="marketing-slider-track d-flex gap-4">
      <div
        class="marketing-card rounded-4 shadow-sm"
        *ngFor="let i of [1, 2, 3, 4, 5, 6]"
      >
        <img
          [src]="'https://picsum.photos/400/300?random=' + i"
          class="rounded-4"
          alt="Marketing"
        />
      </div>
    </div>
  </div>
</section>

<!-- New Arrivals -->
<section class="py-5 bg-white">
  <div class="container">
    <h2 class="section-title">
      {{ settings?.newArrivalsTitle || "New Arrivals" }}
    </h2>
    <div class="row g-4 mt-2">
      <div class="col-md-4 col-lg-2" *ngFor="let prod of newArrivals">
        <app-product-card
          [product]="prod"
          layout="compact"
          (addToCart)="addToCart($event)"
        ></app-product-card>
      </div>
    </div>
  </div>
</section>

<!-- Best Sellers -->
<section class="py-5 bg-light">
  <div class="container">
    <h2 class="section-title">Best Sellers</h2>
    <div class="row g-4 mt-2">
      <div class="col-md-6 col-lg-3" *ngFor="let prod of bestSellers">
        <app-product-card
          [product]="prod"
          layout="grid"
          (addToCart)="addToCart($event)"
        ></app-product-card>
      </div>
    </div>
  </div>
</section>

<!-- Testimonials Slider -->
<section class="py-5 bg-white overflow-hidden">
  <div class="container">
    <h2 class="section-title">What They Say</h2>
    <app-testimonial-slider
      [testimonials]="testimonials"
    ></app-testimonial-slider>
  </div>
</section>
