<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-5">
    <h2 class="fw-bolder">Sales <span class="text-primary">Reports</span></h2>
    <div class="d-flex gap-2 align-items-center bg-white p-2 rounded-pill shadow-sm">
      <input type="date" class="form-control border-0 rounded-pill" [(ngModel)]="startDate">
      <span class="text-gray">to</span>
      <input type="date" class="form-control border-0 rounded-pill" [(ngModel)]="endDate">
      <button class="btn btn-primary rounded-pill px-4" (click)="fetchReport()">Update</button>
    </div>
  </div>

  <div class="row g-4 mb-5">
    <div class="col-md-4">
      <div class="card border-0 shadow-sm rounded-5 p-4 bg-primary text-white">
        <h6 class="text-white-50 small mb-2">Total Revenue</h6>
        <h2 class="fw-bolder mb-0">${{summary.totalRevenue}}</h2>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card border-0 shadow-sm rounded-5 p-4 bg-white">
        <h6 class="text-gray small mb-2">Total Orders</h6>
        <h2 class="fw-bolder mb-0 text-dark">{{summary.totalOrders}}</h2>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card border-0 shadow-sm rounded-5 p-4 bg-white">
        <h6 class="text-gray small mb-2">Avg. Order Value</h6>
        <h2 class="fw-bolder mb-0 text-dark">${{summary.avgOrderValue | number:'1.0-0'}}</h2>
      </div>
    </div>
  </div>

  <div class="card border-0 shadow-sm rounded-5 p-5">
    <h4 class="fw-bold mb-4">Daily Revenue</h4>
    <div class="table-responsive">
      <table class="table align-middle">
        <thead>
          <tr>
            <th>Date</th>
            <th>Orders</th>
            <th>Revenue</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let day of dailyStats">
            <td class="fw-bold">{{day._id}}</td>
            <td>{{day.count}}</td>
            <td class="fw-bolder text-primary">${{day.revenue}}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
