<div class="container py-5 mt-5">
  <div class="row">
    <div class="col-lg-10 mx-auto">
      <div class="d-flex justify-content-between align-items-center mb-5">
        <h2 class="fw-bolder">My <span class="text-primary">Addresses</span></h2>
        <button class="btn btn-primary rounded-pill px-4" (click)="showForm = true" *ngIf="!showForm">
          <i class="fas fa-plus me-2"></i>Add New Address
        </button>
      </div>

      <!-- Add Address Form -->
      <div class="card glass-morphism border-0 shadow-lg p-5 rounded-5 mb-5" *ngIf="showForm">
        <h4 class="fw-bold mb-4">New Address</h4>
        <div class="row g-4">
          <div class="col-md-6">
            <label class="form-label small fw-bold">Address Label</label>
            <input type="text" class="form-control rounded-pill" [(ngModel)]="newAddr.alias" placeholder="Home, Work, etc.">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-bold">Phone Number</label>
            <input type="text" class="form-control rounded-pill" [(ngModel)]="newAddr.phone" placeholder="01xxxxxxxxx">
          </div>
          <div class="col-12">
            <label class="form-label small fw-bold">Full Details</label>
            <textarea class="form-control rounded-4" rows="3" [(ngModel)]="newAddr.details" placeholder="Street name, building number..."></textarea>
          </div>
        </div>
        <div class="d-flex gap-2 mt-4">
          <button class="btn btn-primary rounded-pill px-5 py-2 fw-bold" (click)="saveAddress()">Save Address</button>
          <button class="btn btn-light rounded-pill px-5 py-2" (click)="showForm = false">Cancel</button>
        </div>
      </div>

      <!-- Address List -->
      <div class="row g-4">
        <div class="col-md-6" *ngFor="let addr of addresses">
          <div class="card border-0 shadow-sm rounded-5 p-4 position-relative" [class.border-primary]="addr.isDefault" [style.border-width]="addr.isDefault ? '2px' : '0px'">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="fw-bold mb-0 text-uppercase">{{addr.alias}}</h5>
              <span class="badge bg-primary rounded-pill" *ngIf="addr.isDefault">Default</span>
            </div>
            <p class="text-gray small mb-1">{{addr.details}}</p>
            <p class="fw-bold mb-3">{{addr.phone}}</p>
            
            <div class="d-flex gap-2">
              <button class="btn btn-sm btn-outline-primary rounded-pill px-3" (click)="setDefault(addr._id)" *ngIf="!addr.isDefault">Set as Default</button>
              <button class="btn btn-sm btn-outline-danger rounded-pill px-3 ms-auto" (click)="deleteAddress(addr._id)">Delete</button>
            </div>
          </div>
        </div>
      </div>

      <div class="text-center py-5" *ngIf="!addresses.length && !showForm">
        <i class="fas fa-map-marked-alt text-light display-1 mb-4"></i>
        <h4 class="text-gray">No addresses saved yet</h4>
      </div>
    </div>
  </div>
</div>
